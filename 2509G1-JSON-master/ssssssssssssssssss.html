<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Halls | WeDream</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --rose:#b93b56;--rose-hover:#a22f49;
  --gold:#c89b2c;--gold-light:#e8b93c;--gold-dark:#8a691a;
  --dark:#0a0708;--dark2:#0e0b0c;
  --card-glass:rgba(20,15,17,.72);--border-glow:rgba(200,155,44,.3);
}
body{background:var(--dark);font-family:'Jost',sans-serif;color:#f0ede8;overflow-x:hidden}

.premium-halls-section{padding:70px 24px 90px;background:radial-gradient(circle at 10% 20%,#110c0e 0%,#050303 100%);position:relative;min-height:100vh}
.premium-section-accent{height:2px;width:120px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-light),transparent);margin:0 auto 16px}
.section-title-premium{text-align:center;font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:700;letter-spacing:2px;color:#fff;margin-bottom:10px}
.section-title-premium span{color:var(--gold);font-style:italic}
.section-sub{text-align:center;color:rgba(255,255,255,.6);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:36px}

/* Category switcher */
.category-switcher{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:920px;margin:0 auto 28px}
.cat-pill{
  position:relative;background:linear-gradient(140deg,rgba(200,155,44,.08),rgba(185,59,86,.05));
  border:1px solid rgba(200,155,44,.25);color:#f0ede8;
  padding:14px 22px;border-radius:14px;font-weight:600;font-size:.82rem;letter-spacing:1.2px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;
  transition:all .35s cubic-bezier(.2,.8,.2,1);overflow:hidden;
}
.cat-pill i{font-size:1rem;color:var(--gold)}
.cat-pill:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 30px -10px rgba(200,155,44,.4);color:#fff}
.cat-pill.active{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#0b0708;border-color:transparent}
.cat-pill.active i{color:#0b0708}

/* Area filter — unique horizontal scroll chips with underline indicator */
.area-rail-wrap{max-width:1200px;margin:0 auto 18px;position:relative}
.area-rail{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 14px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.area-rail::-webkit-scrollbar{height:4px}.area-rail::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px}
.area-chip{
  flex:0 0 auto;background:transparent;border:none;color:rgba(255,255,255,.55);
  font-family:'Jost',sans-serif;font-weight:500;font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;
  padding:10px 18px;cursor:pointer;position:relative;white-space:nowrap;transition:color .25s
}
.area-chip:hover{color:#fff}
.area-chip.active{color:var(--gold)}
.area-chip.active::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px}

/* Search + sort row */
.tool-row{max-width:1200px;margin:0 auto 32px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:0 4px}
.search-wrap{position:relative;flex:1;min-width:240px;max-width:380px}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:.85rem}
.search-wrap input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(200,155,44,.2);color:#fff;padding:11px 14px 11px 38px;border-radius:12px;font-size:.85rem;outline:none;transition:border-color .25s}
.search-wrap input:focus{border-color:var(--gold)}
.sort-wrap select{background:rgba(255,255,255,.04);border:1px solid rgba(200,155,44,.2);color:#fff;padding:11px 14px;border-radius:12px;font-size:.85rem;outline:none;cursor:pointer}

/* Cards grid */
.halls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px;max-width:1280px;margin:0 auto}

.hall-card{
  position:relative;background:var(--card-glass);border:1px solid rgba(200,155,44,.15);
  border-radius:18px;overflow:hidden;cursor:pointer;
  transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,border-color .3s;
  backdrop-filter:blur(8px);
}
.hall-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 24px 50px -20px rgba(0,0,0,.9),0 0 0 1px rgba(200,155,44,.35)}

.hall-media{position:relative;aspect-ratio:4/3;overflow:hidden}
.hall-media img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.hall-card:hover .hall-media img{transform:scale(1.08)}
.hall-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,5,6,.85) 0%,transparent 50%);pointer-events:none}

/* Small premium icon badge */
.premium-icon{
  position:absolute;top:12px;left:12px;
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-light));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(200,155,44,.5);
  font-size:.78rem;color:#0b0708;z-index:3;
}
.premium-icon::after{content:"PREMIUM";position:absolute;top:50%;left:calc(100% + 6px);transform:translateY(-50%);background:rgba(11,7,8,.92);color:var(--gold);font-size:.55rem;letter-spacing:1.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--gold-dark);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}
.premium-icon:hover::after{opacity:1}

/* Compare button — visible only on card hover */
.compare-btn{
  position:absolute;top:12px;right:12px;z-index:3;
  background:rgba(11,7,8,.85);border:1px solid var(--gold);color:var(--gold);
  width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:.9rem;cursor:pointer;
  opacity:0;transform:translateY(-6px);transition:all .35s;
}
.hall-card:hover .compare-btn{opacity:1;transform:translateY(0)}
.compare-btn:hover{background:var(--gold);color:#0b0708;transform:scale(1.08)}
.compare-btn.added{background:var(--gold);color:#0b0708}

.hall-body{padding:18px 18px 20px}
.hall-area{font-size:.65rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hall-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:#fff;font-weight:600;line-height:1.2;margin-bottom:10px}
.hall-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.82rem}
.rating-pill{color:#ffd05a;display:inline-flex;align-items:center;gap:5px}
.price{color:#fff;font-weight:600}
.price small{color:rgba(255,255,255,.5);font-weight:400;font-size:.7rem}

.details-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:11px;border-radius:10px;
  background:linear-gradient(135deg,var(--rose),#8e2c42);color:#fff;
  border:none;font-size:.78rem;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
  cursor:pointer;transition:all .3s;
}
.details-btn:hover{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#0b0708;transform:translateY(-2px)}

/* Compare tray */
.compare-tray{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120%);
  background:rgba(11,7,8,.95);border:1px solid var(--gold);border-radius:16px;
  padding:14px 18px;display:flex;align-items:center;gap:14px;z-index:50;
  box-shadow:0 20px 50px rgba(0,0,0,.7);backdrop-filter:blur(12px);
  transition:transform .4s cubic-bezier(.2,.8,.2,1);
}
.compare-tray.show{transform:translateX(-50%) translateY(0)}
.compare-tray .ctitle{font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.compare-tray .cbtn{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#0b0708;border:none;padding:9px 16px;border-radius:10px;font-weight:600;font-size:.78rem;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer}
.compare-tray .cclear{background:transparent;color:rgba(255,255,255,.6);border:none;cursor:pointer;font-size:.85rem}

/* Compare modal */
.cmp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.cmp-overlay.show{display:flex}
.cmp-box{background:var(--dark2);border:1px solid var(--gold);border-radius:18px;max-width:900px;width:100%;padding:26px;color:#fff;position:relative}
.cmp-box h3{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--gold);margin-bottom:18px}
.cmp-close{position:absolute;top:12px;right:14px;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
.cmp-table{width:100%;border-collapse:collapse;font-size:.85rem}
.cmp-table th,.cmp-table td{padding:12px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.cmp-table th{color:var(--gold);font-weight:600;text-transform:uppercase;font-size:.7rem;letter-spacing:1.2px}
.cmp-table td.yes{color:#7fd28a}.cmp-table td.no{color:#e87878}

.empty-state{text-align:center;color:rgba(255,255,255,.5);padding:60px 0;grid-column:1/-1}
.loader-ring{width:50px;height:50px;border:3px solid rgba(200,155,44,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .section-title-premium{font-size:2.1rem}
  .cat-pill{padding:11px 16px;font-size:.72rem}
}
</style>
</head>
<body>

<section class="premium-halls-section">
  <div class="premium-section-accent"></div>
  <h1 class="section-title-premium">Premium <span>Halls</span></h1>
  <p class="section-sub">Curated Wedding Venues — Karachi</p>

  <!-- Category Filter -->
  <div class="category-switcher">
    <a href="halls.html" class="cat-pill active"><i class="fa-solid fa-building-columns"></i>Halls</a>
    <a href="catering.html" class="cat-pill"><i class="fa-solid fa-utensils"></i>Catering</a>
    <a href="photographers.html" class="cat-pill"><i class="fa-solid fa-camera-retro"></i>Photographers</a>
    <a href="car-rentals.html" class="cat-pill"><i class="fa-solid fa-car"></i>Car Rentals</a>
    <a href="decorators.html" class="cat-pill"><i class="fa-solid fa-wand-magic-sparkles"></i>Decorators</a>
  </div>

  <!-- Area Filter -->
  <div class="area-rail-wrap">
    <div class="area-rail" id="areaRail"></div>
  </div>

  <!-- Search + Sort -->
  <div class="tool-row">
    <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="text" placeholder="Search by name…"></div>
    <div class="sort-wrap">
      <select id="sortSel">
        <option value="rating">Top Rated</option>
        <option value="price_low">Price: Low to High</option>
        <option value="price_high">Price: High to Low</option>
        <option value="name">Name (A–Z)</option>
      </select>
    </div>
  </div>

  <div class="halls-grid" id="hallsGrid">
    <div class="loader-ring"></div>
  </div>
</section>

<!-- Compare tray -->
<div class="compare-tray" id="cmpTray">
  <span class="ctitle">Compare <b id="cmpCount">0</b>/3</span>
  <button class="cbtn" id="cmpOpen">Compare Now</button>
  <button class="cclear" id="cmpClear">Clear</button>
</div>

<!-- Compare modal -->
<div class="cmp-overlay" id="cmpOverlay">
  <div class="cmp-box">
    <button class="cmp-close" id="cmpCloseBtn"><i class="fa-solid fa-xmark"></i></button>
    <h3>Compare Halls</h3>
    <div id="cmpContent" style="overflow-x:auto"></div>
  </div>
</div>

<script>
let HALLS=[],DETAILS=[],compareIds=JSON.parse(localStorage.getItem('cmpIds')||'[]'),currentArea='All';
const grid=document.getElementById('hallsGrid');
const fallback="https://images.pexels.com/photos/265947/pexels-photo-265947.jpeg?auto=compress&cs=tinysrgb&w=800&h=520&fit=crop";

Promise.all([
  fetch('halls.json').then(r=>r.json()),
  fetch('hallsDetails.json').then(r=>r.json()).catch(()=>[])
]).then(([h,d])=>{HALLS=h;DETAILS=d;buildAreas();render();updateTray()})
.catch(e=>{grid.innerHTML='<div class="empty-state">Failed to load halls.</div>';console.error(e)});

function buildAreas(){
  const areas=['All',...new Set(HALLS.map(h=>h.area))];
  const rail=document.getElementById('areaRail');
  rail.innerHTML=areas.map(a=>`<button class="area-chip ${a===currentArea?'active':''}" data-area="${a}">${a}</button>`).join('');
  rail.querySelectorAll('.area-chip').forEach(b=>b.onclick=()=>{currentArea=b.dataset.area;buildAreas();render()});
}

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const sort=document.getElementById('sortSel').value;
  let list=HALLS.filter(h=>(currentArea==='All'||h.area===currentArea)&&h.name.toLowerCase().includes(q));
  list.sort((a,b)=>{
    if(sort==='price_low')return a.starting_price-b.starting_price;
    if(sort==='price_high')return b.starting_price-a.starting_price;
    if(sort==='name')return a.name.localeCompare(b.name);
    return b.rating-a.rating;
  });
  if(!list.length){grid.innerHTML='<div class="empty-state">No halls match your filters.</div>';return}
  grid.innerHTML=list.map(h=>`
    <div class="hall-card" data-id="${h.id}">
      <div class="hall-media">
        <img src="${h.image||fallback}" alt="${h.name}" onerror="this.src='${fallback}'">
        <div class="premium-icon" title="Premium Verified"><i class="fa-solid fa-crown"></i></div>
        <button class="compare-btn ${compareIds.includes(h.id)?'added':''}" data-cmp="${h.id}" title="Add to compare"><i class="fa-solid fa-${compareIds.includes(h.id)?'check':'scale-balanced'}"></i></button>
      </div>
      <div class="hall-body">
        <div class="hall-area"><i class="fa-solid fa-location-dot"></i>${h.area}</div>
        <div class="hall-name">${h.name}</div>
        <div class="hall-meta">
          <span class="rating-pill"><i class="fa-solid fa-star"></i>${h.rating}</span>
          <span class="price">PKR ${h.starting_price.toLocaleString()} <small>onwards</small></span>
        </div>
        <button class="details-btn" data-details="${h.id}"><i class="fa-solid fa-circle-info"></i>View Details</button>
      </div>
    </div>`).join('');

  // image + card click → details
  grid.querySelectorAll('.hall-card').forEach(c=>{
    c.addEventListener('click',e=>{
      if(e.target.closest('.compare-btn'))return;
      window.location.href='hall-detail.html?id='+c.dataset.id;
    });
  });
  grid.querySelectorAll('.compare-btn').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();toggleCompare(+b.dataset.cmp,b)});
  });
}

function toggleCompare(id,btn){
  const i=compareIds.indexOf(id);
  if(i>-1){compareIds.splice(i,1)}
  else{if(compareIds.length>=3){alert('Max 3 halls compare kar sakte hain');return}compareIds.push(id)}
  localStorage.setItem('cmpIds',JSON.stringify(compareIds));
  render();updateTray();
}

function updateTray(){
  document.getElementById('cmpCount').textContent=compareIds.length;
  document.getElementById('cmpTray').classList.toggle('show',compareIds.length>0);
}
document.getElementById('cmpClear').onclick=()=>{compareIds=[];localStorage.setItem('cmpIds','[]');render();updateTray()};
document.getElementById('cmpOpen').onclick=openCompare;
document.getElementById('cmpCloseBtn').onclick=()=>document.getElementById('cmpOverlay').classList.remove('show');

function openCompare(){
  if(!compareIds.length)return;
  const rows=compareIds.map(id=>{
    const d=DETAILS.find(x=>x.id===id)||HALLS.find(x=>x.id===id);
    return d;
  }).filter(Boolean);
  const f=(v,t)=>v?`<td class="yes"><i class="fa-solid fa-check"></i></td>`:`<td class="no"><i class="fa-solid fa-xmark"></i></td>`;
  const tbl=`<table class="cmp-table">
    <tr><th>Feature</th>${rows.map(r=>`<th>${r.name}</th>`).join('')}</tr>
    <tr><td>Area</td>${rows.map(r=>`<td>${r.area}</td>`).join('')}</tr>
    <tr><td>Rating</td>${rows.map(r=>`<td>⭐ ${r.rating}</td>`).join('')}</tr>
    <tr><td>Starting Price</td>${rows.map(r=>`<td>PKR ${r.starting_price.toLocaleString()}</td>`).join('')}</tr>
    <tr><td>Capacity</td>${rows.map(r=>`<td>${r.capacity||'-'}</td>`).join('')}</tr>
    <tr><td>Parking</td>${rows.map(r=>f(r.parking)).join('')}</tr>
    <tr><td>AC</td>${rows.map(r=>f(r.ac)).join('')}</tr>
    <tr><td>In-house Catering</td>${rows.map(r=>f(r.catering)).join('')}</tr>
    <tr><td>Outdoor Space</td>${rows.map(r=>f(r.outdoor)).join('')}</tr>
    <tr><td>Stage</td>${rows.map(r=>f(r.stage)).join('')}</tr>
  </table>`;
  document.getElementById('cmpContent').innerHTML=tbl;
  document.getElementById('cmpOverlay').classList.add('show');
}

document.getElementById('searchInput').addEventListener('input',render);
document.getElementById('sortSel').addEventListener('change',render);
</script>
</body>
</html>
